name: Build and Scan Image
description: Build and scan Dockerfile and container image by hadolint, dockle, trivy, docker scan
branding:
  icon: box
  color: blue
inputs:
  tag:
    description: Image name and optionally tag in "name:tag" format
    required: true
  path:
    description: Path to base directory to run `docker build` command (default ".")
    required: false
    default: "."
  dockerfile:
    description: Path to Dockerfile, which is relative path from "path" parameter (default "Dockerfile")
    required: false
    default: Dockerfile
  hadolint-enable:
    description: Enable scanning Dockerfile by hadolint (default "true")
    required: false
    default: "true"
  hadolint-version:
    description: Hadolint version.
    required: false
    default: "2.12.0" # renovate:hadolint/hadolint
  hadolint-sha256:
    description: SHA-256 of the downloaded hadolint release asset. Override together with hadolint-version.
    required: false
    default: "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
  hadolint-severity:
    description: Fail step if rules with a severity above this level are violated. Acceptable value is one of (error|warning|info|style|ignore|none). (default "info")
    required: false
    default: info
  dockle-enable:
    description: Enable scanning image by dockle (default "true")
    required: false
    default: "true"
  dockle-version:
    description: Dockle version.
    required: false
    default: "0.4.15" # renovate:goodwithtech/dockle
  dockle-sha256:
    description: SHA-256 of the downloaded dockle release asset. Override together with dockle-version.
    required: false
    default: "8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad"
  dockle-severity:
    description: Fail step if checkpoints with a severity above this level are violated. Acceptable value is one of (INFO|WARN|FATAL). (default "WARN")
    required: false
    default: WARN
  trivy-enable:
    description: Enable scanning image by trivy (default "true")
    required: false
    default: "true"
  trivy-version:
    description: Trivy version.
    required: false
    default: "0.69.3" # renovate:aquasecurity/trivy
  trivy-sha256:
    description: SHA-256 of the downloaded trivy release asset. Override together with trivy-version.
    required: false
    default: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  trivy-severity:
    description: Fail step if image has vulnerabilities with a severity same as this level. Acceptable value is comma-separated list of (UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL). (default "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL")
    required: false
    default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  trivy-vuln-type:
    description: Vulnerability types which trivy detect to. Acceptable value is comma-separated list of (os|library). (default "os,library")
    required: false
    default: os,library
  trivy-ignore-unfixed:
    description: Ignore unfixed vulnerabilities (default "false")
    required: false
    default: "false"
  snyk-enable:
    description: Enable scanning image by snyk. If enabled, "snyk-token" must be also set. (default "false")
    required: false
    default: "false"
  snyk-version:
    description: Snyk CLI version.
    required: false
    default: "1.1298.3" # renovate:snyk/snyk
  snyk-sha256:
    description: SHA-256 of the downloaded snyk release asset. Override together with snyk-version.
    required: false
    default: "943cffd46891174b0f660a8d20d9e555910a178ca2f74dff98844b38388e49dd"
  snyk-token:
    description: Snyk API Token. This is necessary if "snyk-enable" is "true". (default "")
    required: false
    default: ""
  snyk-severity:
    description: Fail step if image has vulnerabilities with a severity above this level. Acceptable value is one of (low|medium|high|critical). (default "low")
    required: false
    default: low
  snyk-exclude-base-image-vulns:
    description: Exclude base image vulnerabilities (default "false")
    required: false
    default: "false"
runs:
  using: composite
  steps:
  - name: Scan Dockerfile by hadolint
    run: |
      set -euo pipefail
      echo "::group::Scan Dockerfile by hadolint"

      # Download and verify hadolint before extracting or executing it
      if [[ ! "${HADOLINT_SHA256}" =~ ^[[:xdigit:]]{64}$ ]]; then
        echo "::error::hadolint-sha256 must contain exactly 64 hexadecimal characters"
        exit 1
      fi
      SCANNER_DIR="$(mktemp -d "${RUNNER_TEMP}/hadolint.XXXXXX")"
      trap 'rm -rf -- "${SCANNER_DIR}"' EXIT
      curl -fsSL "${HADOLINT_RELEASE_ASSET_URL}" -o "${SCANNER_DIR}/hadolint"
      printf '%s  %s\n' "${HADOLINT_SHA256}" "${SCANNER_DIR}/hadolint" | sha256sum --check --strict
      chmod +x "${SCANNER_DIR}/hadolint"

      # Scan Dockerfile by hadolint
      "${SCANNER_DIR}/hadolint" --failure-threshold "${HADOLINT_FAILURE_THRESHOLD}" "${DOCKERFILE}"

      echo "::endgroup::"
    env:
      HADOLINT_SHA256: "${{ inputs.hadolint-sha256 }}"
      HADOLINT_RELEASE_ASSET_URL: "https://github.com/hadolint/hadolint/releases/download/v${{ inputs.hadolint-version }}/hadolint-Linux-x86_64"
      HADOLINT_FAILURE_THRESHOLD: "${{ inputs.hadolint-severity}}"
      DOCKERFILE: "${{ inputs.path }}/${{ inputs.dockerfile }}"
    if: ${{ inputs.hadolint-enable == 'true' }}
    shell: bash
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
  - name: Build image
    uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
    with:
      context: ${{ inputs.path }}
      file: ${{ inputs.path }}/${{ inputs.dockerfile }}
      tags: ${{ inputs.tag }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
      load: true
  - name: Scan image by dockle
    run: |
      set -euo pipefail
      echo "::group::Scan image by dockle"

      # Download and verify dockle before extracting or executing it
      if [[ ! "${DOCKLE_SHA256}" =~ ^[[:xdigit:]]{64}$ ]]; then
        echo "::error::dockle-sha256 must contain exactly 64 hexadecimal characters"
        exit 1
      fi
      SCANNER_DIR="$(mktemp -d "${RUNNER_TEMP}/dockle.XXXXXX")"
      trap 'rm -rf -- "${SCANNER_DIR}"' EXIT
      curl -fsSL "${DOCKLE_RELEASE_ASSET_URL}" -o "${SCANNER_DIR}/dockle.tar.gz"
      printf '%s  %s\n' "${DOCKLE_SHA256}" "${SCANNER_DIR}/dockle.tar.gz" | sha256sum --check --strict
      tar zxf "${SCANNER_DIR}/dockle.tar.gz" -C "${SCANNER_DIR}" dockle
      chmod +x "${SCANNER_DIR}/dockle"

      # Scan image by dockle
      "${SCANNER_DIR}/dockle" --exit-code 1 --exit-level "${DOCKLE_EXIT_LEVEL}" "${IMAGE}"

      echo "::endgroup::"
    env:
      DOCKLE_SHA256: "${{ inputs.dockle-sha256 }}"
      DOCKLE_RELEASE_ASSET_URL: "https://github.com/goodwithtech/dockle/releases/download/v${{ inputs.dockle-version }}/dockle_${{ inputs.dockle-version }}_Linux-64bit.tar.gz"
      DOCKLE_EXIT_LEVEL: "${{ inputs.dockle-severity }}"
      IMAGE: "${{ inputs.tag }}"
    if: ${{ inputs.dockle-enable == 'true' }}
    shell: bash
  - name: Scan image by trivy
    run: |
      set -euo pipefail
      echo "::group::Scan image by trivy"

      # Download and verify trivy before extracting or executing it
      if [[ ! "${TRIVY_SHA256}" =~ ^[[:xdigit:]]{64}$ ]]; then
        echo "::error::trivy-sha256 must contain exactly 64 hexadecimal characters"
        exit 1
      fi
      SCANNER_DIR="$(mktemp -d "${RUNNER_TEMP}/trivy.XXXXXX")"
      trap 'rm -rf -- "${SCANNER_DIR}"' EXIT
      curl -fsSL "${TRIVY_RELEASE_ASSET_URL}" -o "${SCANNER_DIR}/trivy.tar.gz"
      printf '%s  %s\n' "${TRIVY_SHA256}" "${SCANNER_DIR}/trivy.tar.gz" | sha256sum --check --strict
      tar zxf "${SCANNER_DIR}/trivy.tar.gz" -C "${SCANNER_DIR}" trivy
      chmod +x "${SCANNER_DIR}/trivy"

      # Scan image by trivy
      "${SCANNER_DIR}/trivy" image "${IMAGE}"

      echo "::endgroup::"
    env:
      TRIVY_SHA256: "${{ inputs.trivy-sha256 }}"
      TRIVY_RELEASE_ASSET_URL: "https://github.com/aquasecurity/trivy/releases/download/v${{ inputs.trivy-version }}/trivy_${{ inputs.trivy-version }}_Linux-64bit.tar.gz"
      TRIVY_EXIT_CODE: "1"
      TRIVY_IGNORE_UNFIXED: "${{ inputs.trivy-ignore-unfixed }}"
      TRIVY_NO_PROGRESS: "true"
      TRIVY_SEVERITY: "${{ inputs.trivy-severity }}"
      TRIVY_PKG_TYPES: "${{ inputs.trivy-vuln-type }}"
      IMAGE: "${{ inputs.tag }}"
    if: ${{ inputs.trivy-enable == 'true' }}
    shell: bash
  - name: Scan image by snyk
    run: |
      set -euo pipefail
      echo "::group::Scan image by snyk"

      # Download and verify snyk before extracting or executing it
      if [[ ! "${SNYK_SHA256}" =~ ^[[:xdigit:]]{64}$ ]]; then
        echo "::error::snyk-sha256 must contain exactly 64 hexadecimal characters"
        exit 1
      fi
      SCANNER_DIR="$(mktemp -d "${RUNNER_TEMP}/snyk.XXXXXX")"
      trap 'rm -rf -- "${SCANNER_DIR}"' EXIT
      curl -fsSL "${SNYK_RELEASE_ASSET_URL}" -o "${SCANNER_DIR}/snyk"
      printf '%s  %s\n' "${SNYK_SHA256}" "${SCANNER_DIR}/snyk" | sha256sum --check --strict
      chmod +x "${SCANNER_DIR}/snyk"

      # Make sure snyk token is passed
      if [ -z "${SNYK_TOKEN}" ]; then
        echo "'snyk-token' is necessary if 'snyk-enable' is 'true'"
        exit 1
      fi

      # Authenticate
      "${SCANNER_DIR}/snyk" auth "${SNYK_TOKEN}"

      # Scan image by snyk
      if [ "${SNYK_EXCLUDE_BASE_IMAGE_VULNS}" == "true" ]; then
        "${SCANNER_DIR}/snyk" container test --file="${DOCKERFILE}" --severity-threshold="${SNYK_SEVERITY_THRESHOLD}" --exclude-base-image-vulns "${IMAGE}"
      else
        "${SCANNER_DIR}/snyk" container test --file="${DOCKERFILE}" --severity-threshold="${SNYK_SEVERITY_THRESHOLD}" "${IMAGE}"
      fi

      echo "::endgroup::"
    env:
      SNYK_SHA256: "${{ inputs.snyk-sha256 }}"
      SNYK_RELEASE_ASSET_URL: "https://github.com/snyk/snyk/releases/download/v${{ inputs.snyk-version }}/snyk-linux"
      SNYK_EXCLUDE_BASE_IMAGE_VULNS: "${{ inputs.snyk-exclude-base-image-vulns }}"
      SNYK_SEVERITY_THRESHOLD: "${{ inputs.snyk-severity }}"
      SNYK_TOKEN: "${{ inputs.snyk-token }}"
      DOCKERFILE: "${{ inputs.path }}/${{ inputs.dockerfile }}"
      IMAGE: "${{ inputs.tag }}"
    if: ${{ inputs.snyk-enable == 'true' }}
    shell: bash
